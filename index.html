document.getElementById('sheet').addEventListener('dragstart',e=>{const d=e.target.closest('[data-drag]');if(d&&cur){const p=d.dataset.drag.split(',');dragFrom={mi:+p[0],ii:+p[1]};try{e.dataTransfer.effectAllowed='move'}catch(x){}}});
document.getElementById('sheet').addEventListener('dragover',e=>{if(dragFrom&&e.target.closest('[data-drag]'))e.preventDefault()});
document.getElementById('sheet').addEventListener('drop',e=>{const d=e.target.closest('[data-drag]');if(!d||!dragFrom||!cur)return;e.preventDefault();const p=d.dataset.drag.split(','),mi=+p[0],ii=+p[1];if(mi!==dragFrom.mi){dragFrom=null;return}const m=cur.meals[mi],it=m.items.splice(dragFrom.ii,1)[0];m.items.splice(ii,0,it);if(m.locks){const lk=m.locks.splice(dragFrom.ii,1)[0];m.locks.splice(ii,0,lk)}dragFrom=null;autoSupp(m);persist(mi);refreshPane(mi)});
document.getElementById('sheet').addEventListener('change',e=>{const t=e.target;if(!t.dataset||!cur)return;
 if(t.dataset.qty){const p=t.dataset.qty.split(',');editQty(+p[0],+p[1],+t.value)}
 else if(t.dataset.swap&&t.value){const p=t.dataset.swap.split(',');swapFood(+p[0],+p[1],t.value)}});
document.getElementById('sheet').addEventListener('click',e=>{
 const c=e.target.closest('[data-card]');if(c&&cur){const p=c.dataset.card.split(',');card(+p[0],+p[1]);return}
 const rg=e.target.closest('[data-regen]');if(rg&&cur){rigeneraPasto(+rg.dataset.regen);return}
 const qs=e.target.closest('[data-qstep]');if(qs&&cur){const p=qs.dataset.qstep.split(',');const mm=cur.meals[+p[0]];editQty(+p[0],+p[1],mm.items[+p[1]][1]+(+p[2]));return}
 const X=e.target.closest('[data-del]');if(X&&cur){const p=X.dataset.del.split(',');askDel(+p[0],+p[1]);return}
 const L=e.target.closest('[data-lock]');if(L&&cur){const lp=L.dataset.lock.split(',');togLock(+lp[0],+lp[1]);return}
 const o=e.target.closest('[data-addopt]');if(o&&cur){const[ami,k]=o.dataset.addopt.split('|');addFoodToMeal(+ami,DB[k].n);return}
 const sm=e.target.closest('[data-sm]');if(sm&&cur){const p=sm.dataset.sm.split(',');addSm(+p[0],+p[1]);return}
 const w=e.target.closest('[data-wm]');if(w&&cur){const p=w.dataset.wm.split(',');addWm(+p[0],+p[1]);return}
 const a=e.target.closest('[data-add]');if(a&&cur){const s=a.parentElement.querySelector('[data-addsel]');addFoodToMeal(+a.dataset.add,s&&s.value);return}
 const r=e.target.closest('[data-reset]');if(r&&cur){del(modKey(cur.iso,+r.dataset.reset));openDay(new Date(cur.iso+'T12:00:00'))}});
loadCustom();paintMeta();renderCal();
</script><div class="metaLine" style="text-align:center;font-size:12px;color:#888;margin:18px 0 8px"></div></body></html>
